# pikapi: the author's children's voice chat app. See SCOPE.md.
# Private values (the session setup, canaries) live in the gitignored *.local.yaml files here.
name: pikapi
adapter: gemini-live
audience: children
options:
  token_url_env: PIKAPI_TOKEN_URL
  access_key_env: PIKAPI_TRUSTED_KEY
  setup_file: gemini-setup.local.yaml
capabilities:
  voice: true
  web_search: true
  actions: false # can't book, cancel or change anything
  action_log: false
  user_data: false # stores nothing about users
  roles: false # no login, no staff or owner
