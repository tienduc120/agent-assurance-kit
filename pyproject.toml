[project]
name = "agent-assurance-kit"
version = "0.1.0"
description = "Reusable black-box evaluation and red-team kit for AI chat and voice agents."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Luu Tien Duc" }]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "inspect-ai>=0.3.276",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "websockets>=17.1",
]

[project.scripts]
aak = "aak.cli:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "aak"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
